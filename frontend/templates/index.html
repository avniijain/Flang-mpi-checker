<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flang MPI Checker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="hero">

<div class="container py-5">

    <!-- ====================================================== -->
    <!-- Header -->
    <!-- ====================================================== -->

    <div class="text-center mb-5">

        <h1 class="display-5 fw-bold">

            Flang MPI Checker

        </h1>

        <p class="lead text-secondary">

            Static MPI Correctness Analysis for Fortran Programs

        </p>

        <div class="mt-3">

            <span class="badge bg-primary">LLVM</span>

            <span class="badge bg-success">Flang</span>

            <span class="badge bg-warning text-dark">MPI</span>

            <span class="badge bg-danger">Static Analysis</span>

        </div>

    </div>

    <!-- ====================================================== -->
    <!-- TOP ROW -->
    <!-- ====================================================== -->

    <div class="row g-4">

        <!-- LEFT -->
        <div class="col-lg-7">

            <div class="glass-card">

                <h3 class="mb-4">

                    Demo Test Suite

                </h3>

                <div class="mb-3">

                    <label class="form-label">

                        Category

                    </label>

                    <select
                        id="demoCategory"
                        class="form-select">

                        <option value="">Select Category</option>

                        <option value="buffer_mismatch">Buffer Mismatch</option>

                        <option value="noncontiguous">Non-Contiguous Arrays</option>

                        <option value="derived_type">Derived Types</option>

                        <option value="optional_args">Optional Arguments</option>

                        <option value="collective_ordering">Collective Ordering</option>

                        <option value="fortran_specific">Fortran Specific</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Test

                    </label>

                    <select
                        id="demoTest"
                        class="form-select">

                        <option>Select Test</option>

                    </select>

                </div>

                <div class="d-grid">

                    <button
                        id="demoBtn"
                        class="btn btn-success">

                        Run Demo Test

                    </button>

                </div>

            </div>

        </div>

        <!-- RIGHT -->
        <div class="col-lg-5">

            <div class="glass-card mb-4">

                <h3 class="mb-4">

                    Analysis Summary

                </h3>

                <div class="summary-grid">

                    <div class="summary-card">

                        <div class="summary-title">

                            Errors

                        </div>

                        <div
                            id="errorCount"
                            class="summary-value text-danger">

                            --

                        </div>

                    </div>

                    <div class="summary-card">

                        <div class="summary-title">

                            Warnings

                        </div>

                        <div
                            id="warningCount"
                            class="summary-value text-warning">

                            --

                        </div>

                    </div>

                </div>

            </div>

            

        </div>

    </div>

    <!-- ====================================================== -->
    <!-- SOURCE PROGRAM -->
    <!-- ====================================================== -->

    <div class="row mt-4">

        <div class="col-12">

            <div class="glass-card">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h3 class="mb-0">

                        Source Program

                    </h3>

                    <div
                        id="loadedTest"
                        class="text-secondary">

                        No demo test loaded

                    </div>

                </div>

                <div class="mb-3">

                    <input
                        id="file"
                        class="form-control"
                        type="file"
                        accept=".f90">

                </div>

                <textarea

                    id="code"

                    class="form-control code-box"

                    placeholder="Paste your Fortran source code here..."

                ></textarea>

                <div class="d-grid mt-4">

                    <button

                        id="run"

                        class="btn btn-primary btn-lg">

                        Analyze Source

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ====================================================== -->
    <!-- DIAGNOSTICS -->
    <!-- ====================================================== -->

    <div class="row mt-4">

        <div class="col-12">

            <div class="glass-card">

                <h3>

                    Diagnostics

                </h3>

                <hr>

                <div
                    id="out"
                    class="terminal">

                    <div class="terminal-placeholder">

                        Run an analysis to view diagnostics.

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ====================================================== -->

    <div class="text-center mt-5 footer">

        Built using LLVM • Flang • MPI • Static Analysis

    </div>

</div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
